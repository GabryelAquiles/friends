<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Especial 3º Ano</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container-central">
    <div class="card login-card">
      <h1>Especial 3º Ano 🎓</h1>
      <p>Digite seu apelido e senha para ver sua homenagem.</p>
      
      <form id="form-login">
        <div class="campo">
          <label for="apelido">Seu Apelido</label>
          <input type="text" id="apelido" placeholder="Ex: Pedrinho, Babi, Gabi..." required autocomplete="username">
        </div>
        
        <div class="campo">
          <label for="senha">Sua Senha</label>
          <input type="text" id="senha" placeholder="Sua senha aqui" required autocomplete="off">
        </div>

        <button type="submit" class="btn-primary">Entrar</button>
      </form>
    </div>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
